# Local development stack.  Quick start:  make setup && make up  →  http://localhost:8000
#
#   app     PHP 8.5 (FrankenPHP image, dev target) running `artisan serve`
#   queue   queue worker (contact-form emails are queued)
#   vite    Vite dev server with hot reload
#   pgsql   PostgreSQL 17      redis   Redis 7      mailpit  catches all mail → http://localhost:8025

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: portfolio-dev
  volumes:
    - .:/app
    - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_PORT: 5432
    DB_DATABASE: portfolio
    DB_USERNAME: portfolio
    DB_PASSWORD: secret
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    XDG_CONFIG_HOME: /tmp/.config
    # Lets Laravel PAO detect AI agents (Claude Code etc.) and emit compact test output.
    CLAUDECODE: ${CLAUDECODE:-}
    AI_AGENT: ${AI_AGENT:-}
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 10

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    restart: unless-stopped
    healthcheck:
      disable: true

  vite:
    <<: *app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on: []
    healthcheck:
      disable: true

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgsql-data:
  redis-data:
