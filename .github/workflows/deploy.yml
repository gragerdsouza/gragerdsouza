name: Deploy

# Deploys to Laravel Cloud only after CI has passed on main.
#
# ON/OFF SWITCH: deploys are DISABLED until the repository variable
#   LARAVEL_CLOUD_DEPLOY_ENABLED = true
# is set (GitHub → Settings → Secrets and variables → Actions → Variables tab).
# While disabled, the deploy job shows as "skipped" and the "Check deploy switch" job says why.
# CI is unaffected.
#
# Setup (one-time, when you are ready):
#   1. Laravel Cloud → your environment → Settings → Deployments: turn OFF "Push to deploy"
#      and copy the Deploy hook URL.
#   2. GitHub → Settings → Secrets and variables → Actions → new secret
#      LARAVEL_CLOUD_DEPLOY_HOOK = <that URL>.
#   3. GitHub → Settings → Secrets and variables → Actions → Variables tab → new variable
#      LARAVEL_CLOUD_DEPLOY_ENABLED = true.  (Set it to false, or delete it, to pause deploys.)
#   4. (Optional) GitHub → Settings → Environments → "production": add required reviewers.
#
# Manual runs (Actions → Deploy → Run workflow) only deploy from main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether to deploy and always says why, so a skipped deploy is never a mystery.
  gate:
    name: Check deploy switch
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.LARAVEL_CLOUD_DEPLOY_ENABLED }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          enabled=$(printf '%s' "$ENABLED" | tr -d '[:space:]"' | tr '[:upper:]' '[:lower:]')
          if [ "$enabled" != "true" ]; then
            reason="LARAVEL_CLOUD_DEPLOY_ENABLED is '${ENABLED:-<not set or not visible>}'. It must be a *repository* variable (Settings > Secrets and variables > Actions > Variables) set to true."
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            reason="Manual deploys only run from main (this run used $REF)."
          elif [ "$EVENT" = "workflow_run" ] && [ "$CI_CONCLUSION" != "success" ]; then
            reason="CI did not pass for ${SHA} (conclusion: ${CI_CONCLUSION})."
          elif [ "$EVENT" = "workflow_run" ] && [ "$CI_EVENT" != "push" ]; then
            reason="CI ran for a ${CI_EVENT}, not a push to main."
          else
            reason=""
          fi

          if [ -n "$reason" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::${reason}"
            echo "Deploy skipped: ${reason}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploying::${SHA} via ${EVENT}"
          fi

  laravel-cloud:
    name: Laravel Cloud
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.deploy == 'true'
    environment:
      name: production
    steps:
      - name: Check deploy hook is configured
        env:
          DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret LARAVEL_CLOUD_DEPLOY_HOOK is not set. See the comments at the top of deploy.yml."
            exit 1
          fi

      - name: Trigger deployment
        env:
          DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        # commit_hash pins the deploy to the exact commit CI tested, not whatever is newest on main.
        run: |
          case "$DEPLOY_HOOK" in *\?*) SEP='&' ;; *) SEP='?' ;; esac
          curl --fail --silent --show-error --retry 3 -X POST "${DEPLOY_HOOK}${SEP}commit_hash=${SHA}"
          echo "Deployment triggered for ${SHA}" >> "$GITHUB_STEP_SUMMARY"
