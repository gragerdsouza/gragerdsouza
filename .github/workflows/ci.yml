name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_EXTENSIONS: bcmath, intl, pdo_sqlite, pdo_pgsql, redis, zip

jobs:
  quality:
    name: Lint · Rector · Larastan · Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Refactoring rules (Rector)
        run: vendor/bin/rector process --dry-run

      - name: Static analysis (Larastan, max level)
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github

      - name: Dependency audit
        run: composer audit

  tests:
    name: Pest · PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    # PHP 8.6 is tracked ahead of GA (scheduled 2026-11-19); failures there don't block merges.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.5', db: sqlite, coverage: true, experimental: false }
          - { php: '8.5', db: pgsql, coverage: false, experimental: false }
          - { php: '8.6', db: sqlite, coverage: false, experimental: true }

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U testing"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Configure PostgreSQL
        if: matrix.db == 'pgsql'
        run: |
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=testing"
            echo "DB_USERNAME=testing"
            echo "DB_PASSWORD=testing"
          } >> "$GITHUB_ENV"

      - name: Tests with 100% coverage gate
        if: matrix.coverage
        run: vendor/bin/pest --coverage --min=100 --coverage-clover=coverage.xml --parallel

      - name: Tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/pest --parallel

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  assets:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, tests, assets]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
